<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Sky Gradient through glass -->
    <linearGradient id="doorSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#2e3856" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <!-- Glass Pane Sheen Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8ea2ff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Handle Glow Filter -->
    <filter id="handleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8ea2ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#13151b" stroke="#2e3342" stroke-width="3" />

  <!-- Window Opening / Outdoor View Area -->
  <rect x="18" y="16" width="92" height="92" rx="8" fill="url(#doorSky)" />

  <!-- Distant Atmospheric Moon / Horizon Light -->
  <circle cx="84" cy="34" r="10" fill="#fef3c7" opacity="0.9" />
  <circle cx="84" cy="34" r="16" fill="#fef3c7" opacity="0.18" />

  <!-- Balcony Railing outside glass (mid-ground depth) -->
  <line x1="18" y1="78" x2="110" y2="78" stroke="#252b38" stroke-width="3.5" />
  <line x1="32" y1="78" x2="32" y2="108" stroke="#252b38" stroke-width="2" />
  <line x1="50" y1="78" x2="50" y2="108" stroke="#252b38" stroke-width="2" />
  <line x1="78" y1="78" x2="78" y2="108" stroke="#252b38" stroke-width="2" />
  <line x1="96" y1="78" x2="96" y2="108" stroke="#252b38" stroke-width="2" />

  <!-- Left Sliding Glass Pane -->
  <rect x="18" y="16" width="46" height="92" rx="6" fill="url(#glassSheen)" stroke="#374151" stroke-width="3" />

  <!-- Right Sliding Glass Pane (Slid slightly inward, overlapping) -->
  <rect x="62" y="16" width="48" height="92" rx="6" fill="url(#glassSheen)" stroke="#4b5563" stroke-width="3.5" />

  <!-- Diagonal Glass Glare Streaks (Iconic Glass Look) -->
  <path d="M 32,108 L 54,16 L 62,16 L 40,108 Z" fill="#ffffff" opacity="0.12" />
  <path d="M 76,108 L 98,16 L 105,16 L 83,108 Z" fill="#ffffff" opacity="0.15" />

  <!-- Center Sliding Door Stile (Overlap Beam) -->
  <rect x="58" y="14" width="8" height="96" rx="2" fill="#1e222d" stroke="#374151" stroke-width="1.5" />

  <!-- Sleek Vertical Glass Door Handle (Periwinkle Accent) -->
  <rect x="70" y="50" width="4.5" height="26" rx="2.25" fill="#8ea2ff" filter="url(#handleGlow)" stroke="#c7d2fe" stroke-width="0.8" />

  <!-- Bottom Hardwood Floor Threshold Line -->
  <rect x="14" y="107" width="100" height="7" rx="3.5" fill="#78350f" opacity="0.85" />
  <line x1="16" y1="108" x2="112" y2="108" stroke="#92400e" stroke-width="1" opacity="0.7" />
</svg>